<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SmartHR - Sign In</title>

    <!-- CSS -->
    <link rel="stylesheet" href="./style.css">
</head>

<body>

    <div class="app">

        <div class="auth-container">

            <!-- LEFT SIDE -->
            <div class="brand-section">

                <div class="brand-content">

                    <div class="logo">
                        HR
                    </div>

                    <h1>SmartHR</h1>

                    <p>
                        Human Resource Management System
                    </p>

                    <div class="feature-list">

                        <div>✓ Secure Authentication</div>

                        <div>✓ Employee Management</div>

                        <div>✓ Attendance Tracking</div>

                        <div>✓ Leave Management</div>

                        <div>✓ Role Based Access</div>

                    </div>

                </div>

            </div>


            <!-- RIGHT SIDE -->
            <div class="form-section">

                <form
                    class="auth-form"
                    id="loginForm"
                >

                    <div class="form-header">

                        <h2>Welcome Back 👋</h2>

                        <p>
                            Sign in to your HRMS account
                        </p>

                    </div>


                    <!-- Message -->
                    <div
                        id="loginMessage"
                        class="message"
                        style="display: none;"
                    ></div>


                    <!-- EMAIL -->
                    <div class="input-group">

                        <label for="loginEmail">
                            Email Address
                        </label>

                        <input
                            type="email"
                            id="loginEmail"
                            name="email"
                            placeholder="you@company.com"
                            required
                        >

                    </div>


                    <!-- PASSWORD -->
                    <div class="input-group">

                        <label for="loginPassword">
                            Password
                        </label>

                        <div class="password-box">

                            <input
                                type="password"
                                id="loginPassword"
                                name="password"
                                placeholder="Enter your password"
                                required
                            >

                            <button
                                type="button"
                                class="show-btn"
                                id="toggleLoginPassword"
                            >
                                Show
                            </button>

                        </div>

                    </div>


                    <!-- OPTIONS -->
                    <div class="login-options">

                        <label>

                            <input
                                type="checkbox"
                                id="rememberMe"
                            >

                            Remember me

                        </label>


                        <a
                            href="forgot-password.html"
                            class="link-button"
                        >
                            Forgot Password?
                        </a>

                    </div>


                    <!-- SIGN IN -->
                    <button
                        type="submit"
                        class="primary-btn"
                    >
                        Sign In
                    </button>


                    <!-- SIGN UP LINK -->
                    <p class="switch-text">

                        Don't have an account?

                        <a
                            href="signup.html"
                            class="link-button"
                        >
                            Create Account
                        </a>

                    </p>

                </form>

            </div>

        </div>

    </div>


    <!-- JavaScript -->
    <script src="js/auth.js"></script>

</body>
</html>
